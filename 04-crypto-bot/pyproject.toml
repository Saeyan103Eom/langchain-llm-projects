[project]
name = "crypto-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Saeyan103Eom",email = "stiller000999@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"

packages = [{include = "crypto_bot", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pydantic = "^2.4.2"
langchain = "^1.3.14"
openai = "^2.48.0"
langchain-openai = "^1.4.1"
python-dotenv = "^1.0.1"
langchain-community = "^0.4.2"
crewai = "^1.15.6"
tavily-python = "^0.7.26"
crewai-tools = {version = "^1.15.6", optional = true}
gradio = "^6.20.0"
langchain-groq = "^1.1.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
