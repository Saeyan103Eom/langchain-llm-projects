[project]
name = "pandas-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Saeyan103Eom",email = "stiller000999@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langchain (>=1.3.14,<2.0.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "langchain-experimental (>=0.4.2,<0.5.0)",
    "tabulate (>=0.10.0,<0.11.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "gradio (>=6.20.0,<7.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]

[tool.poetry]
packages = [{include = "pandas_bot", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
