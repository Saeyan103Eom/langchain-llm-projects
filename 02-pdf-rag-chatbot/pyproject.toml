[project]
name = "pdf-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Saeyan103Eom",email = "stiller000999@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langchain (>=1.3.13,<2.0.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "pypdf (>=6.14.2,<7.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "gradio (>=6.20.0,<7.0.0)",
    "gradio-pdf (>=0.0.24,<0.0.25)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "sentence-transformers (>=5.6.0,<6.0.0)",
    "langchain-classic (>=1.0.8,<2.0.0)",
    "langchain-openai (>=1.4.1,<2.0.0)"
]

[tool.poetry]
packages = [{include = "pdf_bot", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
