[project]
name = "qa-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "Saeyan103Eom",email = "stiller000999@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langchain-core (>=1.4.9,<2.0.0)",
    "langchain-openai (>=1.3.5,<2.0.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "gradio (>=6.20.0,<7.0.0)"
]

[tool.poetry]
packages = [{include = "qa_bot", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
